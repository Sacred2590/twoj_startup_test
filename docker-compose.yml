version: '3.8'

services:
    app:
        build:  
            context: .
            dockerfile: .docker/php/Dockerfile
        container_name: denysa-app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - .:/var/www
        depends_on:
            - mysql
        networks:
            - laravel
    nginx:
        image: nginx:alpine
        container_name: denysa-nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8100}:80"
        volumes:
            - .:/var/www
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - laravel

    mysql:
        image: mysql:8.0
        container_name: denysa-db
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${DB_PORT:-3306}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - laravel

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: denysa-phpmyadmin
        restart: always
        environment:
            PMA_HOST: mysql
            PMA_PORT: ${DB_PORT:-3306}
            PMA_USER: ${DB_USERNAME}
            PMA_PASSWORD: ${DB_PASSWORD}
        ports:
            - "${PHPMYADMIN_PORT:-8080}:80"
        depends_on:
            - mysql
        networks:
            - laravel
    queue:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
        container_name: denysa-queue
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan queue:work --tries=3 --timeout=60
        volumes:
            - .:/var/www
        depends_on:
            - mysql
            - app
        networks:
            - laravel

    mailhog:
        container_name: denysa-mailhog
        image: mailhog/mailhog:v1.0.0
        ports:
            - "1025:1025"
            - "8025:8025"
        depends_on:
            - mysql
            - app
        networks:
            - laravel    
volumes:
    mysql-data:
networks:
  laravel: